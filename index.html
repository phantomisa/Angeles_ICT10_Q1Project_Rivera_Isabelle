<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU GENERATOR</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="styles.css" rel="stylesheet">

    <style>
        body{
            background-color: #371e13;
        }
        .form-control{
            background-color: #e1d3a9;
            border: 0px;
        }
    </style>

</head>
<body>

    <nav class="navbar navbar-expand-sm" style="background-color: #8f7c3a; box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav ms-auto" style="font-weight: bold; color: #534831;">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" target="_self">SKU Generator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt.html" target="_self" >Receipt Generator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="main" style="max-width: 550px; width: 40%; border-radius: 20px; overflow: hidden; justify-self: center; margin: 5%; box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);">
        <div id="header" style="background-color: #5e2a25; color: #e1d3a9; padding: 25px; text-align: center;">
            <h1><b>SKU GENERATOR</b></h1>
            <h6>Fill the form then generate your SKU.</h6>
        </div>

        <div id="body" style="background-color: #a97e63; color: #371e13; padding: 7.5%;">
            <form style="width: 80%; justify-self: center; font-weight: bold;">
                <div class="form-group" style="padding: 2%;">
                    <label>Category</label>
                    <select id="category" class="form-control" required>
                        <option value="espressos">Espressos</option>
                        <option value="teas">Teas</option>
                        <option value="frappes">Frappucchinos</option>
                        <option value="food">Food</option>
                    </select>
                </div>
                <div class="form-group" style="padding: 2%;">
                    <label>Product Name</label>
                    <input type="text" class="form-control" id="productName" placeholder="e.g. VANILLA CREAM FRAPPE" required style="text-transform: uppercase;" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')">
                </div>
                <div class="form-group" style="padding: 2%;">
                    <label>Stock Quantity</label>
                    <input type="number" class="form-control" id="stockQty" placeholder="e.g. 50" min="0" required>
                </div>
            </form>
            
            <div class="w-100 mt-5 text-center">
                <button type="button" id="compute_btn" py-click="generateSKU" class="form-control" style="width: 50%; justify-self: center; background-color: #5e2a25; color: #e1d3a9;"> <b>COMPUTE</b></button>
                <!-- compute button --> 
            </div>

            <div id="skuResult" style="margin-top: 5%; text-align: center;">
                <span class="text-muted small">Your generated SKU will appear here.</span>
                <script type="py" src="main.py" config='{"packages": []}'></script>
            </div>

            
        </div>
    </div>
    
</body>
</html>
