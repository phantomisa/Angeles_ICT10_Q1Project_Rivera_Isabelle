<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECEIPT GENERATOR</title>

    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Bootstrap CSS, Icons, and Bundle -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="styles.css" rel="stylesheet">

    <style>
        body {
            background-color: #371e13;
        }
        .form-control {
            background-color: #e1d3a9;
            border: 0px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-sm" style="background-color: #8f7c3a; box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav ms-auto" style="font-weight: bold; color: #534831;">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" target="_self">SKU Generator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt.html" target="_self">Receipt Generator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="main" style="max-width: 550px; width: 40%; border-radius: 20px; overflow: hidden; margin: 3rem auto; box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);">
        <div id="header" style="background-color: #5e2a25; color: #e1d3a9; padding: 25px; text-align: center;">
            <h1><b>RECEIPT GENERATOR</b></h1>
            <h6>Give your order then generate your receipt.</h6>
        </div>

        <div id="body" style="background-color: #a97e63; color: #371e13; padding: 7.5%;">
            <form style="width: 97.5%; margin: 0 auto; font-weight: bold;">
                <div class="form-group" style="padding: 2%;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox" id="item_brewed">
                            <label class="form-check-label" for="item_brewed">Brewed Coffee (₱299)</label>
                        </div>
                        <input type="number" id="qty_brewed" class="form-control" style="width: 20%; text-align: center;" value="1" min="1">
                    </div>
                </div>

                <div class="form-group" style="padding: 2%;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox" id="item_americano">
                            <label class="form-check-label" for="item_americano">Americano (₱299)</label>
                        </div>
                        <input type="number" id="qty_americano" class="form-control" style="width: 20%; text-align: center;" value="1" min="1">
                    </div>
                </div>

                <div class="form-group" style="padding: 2%;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox" id="item_iced-lemon">
                            <label class="form-check-label" for="item_iced-lemon">Iced Green Tea Lemonade (₱199)</label>
                        </div>
                        <input type="number" id="qty_iced-lemon" class="form-control" style="width: 20%; text-align: center;" value="1" min="1">
                    </div>
                </div>

                <div class="form-group" style="padding: 2%;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox" id="item_iced-matcha">
                            <label class="form-check-label" for="item_iced-matcha">Iced Matcha Green Tea Latte (₱199)</label>
                        </div>
                        <input type="number" id="qty_iced-matcha" class="form-control" style="width: 20%; text-align: center;" value="1" min="1">
                    </div>
                </div>

                <div class="form-group" style="padding: 2%;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox" id="item_uni-frappe">
                            <label class="form-check-label" for="item_uni-frappe">Unicorn Frappuccino (₱399)</label>
                        </div>
                        <input type="number" id="qty_uni-frappe" class="form-control" style="width: 20%; text-align: center;" value="1" min="1">
                    </div>
                </div>

                <div class="form-group" style="padding: 2%;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox" id="item_croissant">
                            <label class="form-check-label" for="item_croissant">Almond Croissant (₱99)</label>
                        </div>
                        <input type="number" id="qty_croissant" class="form-control" style="width: 20%; text-align: center;" value="1" min="1">
                    </div>
                </div>


                <div class="w-100 mt-4 text-center">
                    <button type="button" id="compute_btn" py-click="generateRECEIPT" class="form-control" style="width: 60%; margin: 0 auto; background-color: #5e2a25; color: #e1d3a9;">
                        <i class="bi bi-receipt me-2"></i><b>CREATE ORDER</b>
                    </button>
                </div>
            </form>

            <div id="receiptResult" style="margin-top: 5%; text-align: center;">
                <span class="text-muted small">Your order summary will appear here.</span>
            </div>
        </div>
    </div>

    <script type="py" src="receipt.py" config='{"packages": []}'></script>

</body>
</html>
